  <main class="contact-wrap">
    <section class="contact-card">
      <h1>Nous contacter</h1>
      <p class="contact-subtitle">Remplis ce formulaire, on te répond rapidement.</p>

      <!-- OPTION SIMPLE (sans serveur) : mailto -->
      <div class="mailto-box">
        <form class="contact-form" id="mailtoForm">
          <div class="grid">
            <div class="field">
              <label for="nom2">Nom</label>
              <input id="nom2" type="text" required />
            </div>

            <div class="field">
              <label for="prenom2">Prénom</label>
              <input id="prenom2" type="text" required />
            </div>
          </div>

          <div class="field">
            <label for="email2">Adresse mail</label>
            <input id="email2" type="email" required />
          </div>

          <div class="field">
            <label for="motif2">Motif du problème</label>
            <textarea id="motif2" rows="5" required></textarea>
          </div>

          <button class="btn btn-outline" type="submit">Envoyer</button>
        </form>
      </div>
    </section>
  </main>
  <script>
    // Menu mobile (si tu en as besoin)
    const toggle = document.getElementById("menu-toggle");
    const links = document.getElementById("nav-links");
    if (toggle && links) {
      toggle.addEventListener("click", () => links.classList.toggle("open"));
    }

    // Mailto (sans serveur)
    document.getElementById("mailtoForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const nom = document.getElementById("nom2").value.trim();
      const prenom = document.getElementById("prenom2").value.trim();
      const email = document.getElementById("email2").value.trim();
      const motif = document.getElementById("motif2").value.trim();

      const to = "outlook_4F15F958F0E7CE71@outlook.com"; // <-- Mets ton email ici
      const subject = encodeURIComponent("Demande de contact - Mat'inf");
      const body = encodeURIComponent(
        `Nom: ${nom}\nPrénom: ${prenom}\nEmail: ${email}\n\nMotif:\n${motif}`
      );

      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });
  </script>

  <footer class="footer">
    <p>© 2026 Mat'inf. Tous droits réservés.</p>
